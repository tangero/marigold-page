{{ define "main" }}
<article class="page rating-board">
  <h1>{{ .Title }}</h1>
  <p class="rating-board-intro">Podle hodnocení čtenářů pod články na Marigold.cz a Vibecoding.cz. Pořadí určuje počet hlasů za zvolené období.</p>

  <div class="rating-board-periods" role="tablist" aria-label="Období">
    <button type="button" role="tab" data-period="7d">7 dní</button>
    <button type="button" role="tab" data-period="1m">Měsíc</button>
    <button type="button" role="tab" data-period="3m">3 měsíce</button>
    <button type="button" role="tab" data-period="6m">6 měsíců</button>
  </div>

  <ol class="rating-board-list" aria-live="polite"></ol>
  <p class="rating-board-status">Načítám…</p>
</article>

{{/* Data: https://www.vibecoding.cz/api/rating/top (repo vibecoding-site, docs/article-rating.md) */}}
<script>
(function () {
  var API = 'https://www.vibecoding.cz/api/rating/top';
  var list = document.querySelector('.rating-board-list');
  var status = document.querySelector('.rating-board-status');
  var tabs = document.querySelectorAll('.rating-board-periods button');

  var ICONS = 'https://www.vibecoding.cz/images/reactions/';
  // Pořadí a popisky jako v boxu pod článkem (vibecoding-site public/js/mg-comments.js).
  var REACTIONS = [
    ['happy', 'Super'], ['insightful', 'Poučné'], ['funny', 'Pobavilo'],
    ['neutral', 'K zamyšlení'], ['meh', 'Nic nového'], ['sad', 'Nesouhlasím'],
  ];

  function plural(n, one, few, many) {
    return n + ' ' + (n === 1 ? one : n >= 2 && n <= 4 ? few : many);
  }

  function span(className, text) {
    var el = document.createElement('span');
    if (className) el.className = className;
    if (text) el.textContent = text;
    return el;
  }

  function render(items) {
    list.innerHTML = '';
    items.forEach(function (a) {
      var li = document.createElement('li');
      var link = document.createElement('a');
      link.href = a.url || '#';
      link.textContent = a.title;
      var meta = span('rating-board-meta');
      meta.appendChild(span('', plural(a.totalVotes, 'hlas', 'hlasy', 'hlasů')));
      REACTIONS.forEach(function (r) {
        var n = (a.feedback && a.feedback[r[0]]) || 0;
        if (!n) return;
        var item = span('rating-board-reaction');
        item.title = r[1];
        var icon = document.createElement('img');
        icon.src = ICONS + r[0] + '.svg';
        icon.alt = r[1];
        icon.width = 18;
        icon.height = 18;
        item.appendChild(icon);
        item.appendChild(document.createTextNode(String(n)));
        meta.appendChild(item);
      });
      // `comments`: počet zveřejněných komentářů, null = web bez diskuse.
      if (typeof a.comments === 'number' && a.comments > 0 && a.url) {
        var c = document.createElement('a');
        c.className = 'rating-board-comments';
        c.href = a.url + '#komentare';
        c.textContent = '💬 ' + plural(a.comments, 'komentář', 'komentáře', 'komentářů');
        meta.appendChild(c);
      }
      if (/vibecoding\.cz$/.test(a.domain || '')) meta.appendChild(span('', 'Vibecoding.cz'));
      li.appendChild(link);
      li.appendChild(meta);
      list.appendChild(li);
    });
    status.textContent = items.length ? '' : 'Za toto období zatím nikdo nehodnotil.';
  }

  function load(period) {
    tabs.forEach(function (t) { t.setAttribute('aria-selected', String(t.dataset.period === period)); });
    status.textContent = 'Načítám…';
    fetch(API + '?period=' + period + '&limit=20')
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (body) { render(body.result || []); })
      .catch(function () { list.innerHTML = ''; status.textContent = 'Žebříček se nepodařilo načíst.'; });
  }

  tabs.forEach(function (t) { t.addEventListener('click', function () { load(t.dataset.period); }); });
  load('1m');
})();
</script>
{{ end }}
